[package]
name = "qx-desktop"
version = "0.1.0"
edition.workspace = true
description = "Qiaoxiang AI Tour Guide - Rust server + gpui-kit WebView2 shell, zero Python"

[[bin]]
name = "qx-desktop"
path = "src/main.rs"

[dependencies]
qx-core = { path = "../qx-core" }
gpui-kit = "0.9.0"
gpui-webview = "0.9.0"
wry = { version = "0.53.3", package = "lb-wry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
