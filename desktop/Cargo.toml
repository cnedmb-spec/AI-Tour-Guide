[package]
name = "qiaoxiang-guide-desktop"
version = "1.0.0"
edition = "2024"
description = "Qiaoxiang AI Tour Guide - desktop shell built with GPUI Kit + WebView2"

[dependencies]
gpui-kit = "0.9.0"
gpui-webview = "0.9.0"
wry = { version = "0.53.3", package = "lb-wry" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 1
codegen-units = 16
debug = false
strip = true
