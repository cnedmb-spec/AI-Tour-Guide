[package]
name = "qx-desktop"
version = "0.1.0"
edition.workspace = true
description = "Qiaoxiang AI Tour Guide - Rust server + gpui-kit WebView2 shell, zero Python"

[[bin]]
name = "qx-desktop"
path = "src/main.rs"

[features]
# Piper TTS 与 ONNX Runtime 动态加载默认启用，无需额外 feature。
default = []
# mtmd = llama.cpp 多模态投影器，内置 Qwen2.5-VL 看图要用
local-llm = ["dep:llama-cpp-2", "llama-cpp-2/mtmd"]

[dependencies]
qx-core = { path = "../qx-core" }
gpui-kit = "0.9.0"
gpui-webview = "0.9.0"
wry = { version = "0.53.3", package = "lb-wry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 运行日志：tracing 打点 + QX_LOG 环境变量过滤；文件落盘由自研日志库承担
# （后台线程 + tokio 异步写入，按天滚动在外层实现）
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "ansi",
  "registry",
  "std",
] }
shen_eternity_log = { git = "https://github.com/EternityShen/shen_eternity_log.git" }
tokio = { version = "1", default-features = false, features = ["rt"] }
zip = "0.6"
# 离线 Piper VITS：项目内 Rust 音素化与 ORT 动态加载实现（随 tts/ 资产释放）。
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }

# 麦克风采集：Windows WASAPI / macOS CoreAudio / Linux ALSA，替代浏览器 WebAudio
cpal = "0.18"
# 离线语音识别：纯 Rust CPU 推理（Qwen3-ASR 0.6B）
# 关闭默认的 download/cli 特性，避免引入 reqwest、CLI 和构建期模型下载。
valle-asr = { version = "0.2.0", default-features = false, features = ["qwen3"] }

llama-cpp-2 = { version = "0.1", optional = true }

[build-dependencies]
zip = "0.6"
